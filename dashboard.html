<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မျိုးထူး - POS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    
    <nav class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-xl font-bold tracking-wide">မျိုးထူး ဆောက်လုပ်ရေးပစ္စည်းအရောင်းဆိုင်</h1>
            <p class="text-xs text-slate-400">တိုက်ရိုက် Google Sheets ပစ္စည်းလက်ကျန်ကြည့်စနစ်</p>
        </div>
        <div class="flex items-center space-x-4">
            <span id="userInfo" class="bg-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium">Loading...</span>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">လော့ဂ်အောက်ထွက်ရန်</button>
        </div>
    </nav>

    <div class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                <span class="text-sm font-medium text-slate-600">ဒေတာအခြေအနေ: <span id="syncStatus" class="text-orange-500 font-bold">Google Sheets နှင့် ချိတ်ဆက်နေဆဲ...</span></span>
                <button onclick="fetchProductsFromSheet()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition">Manual Refresh</button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">ကုန်ပစ္စည်းများ (လက်ကျန်စာရင်း)</h3>
                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit space-y-4">
            <h3 class="text-lg font-bold text-slate-800 border-b pb-2">ယခုဝယ်ယူမည့် ဘောက်ချာ</h3>
            <div id="cartItems" class="space-y-3 min-h-[200px] max-h-[400px] overflow-y-auto">
                <p class="text-slate-400 text-center py-8">ဘောက်ချာထဲတွင် ပစ္စည်းမရှိသေးပါ။</p>
            </div>
            
            <div class="border-t pt-4 space-y-2">
                <div class="flex justify-between font-bold text-lg text-slate-800">
                    <span>စုစုပေါင်း ကျသင့်ငွေ:</span>
                    <span><span id="cartTotal">0</span> ကျပ်</span>
                </div>
            </div>
            
            <button onclick="checkoutCart()" id="checkoutBtn" disabled class="w-full bg-slate-400 text-white font-bold py-3 rounded-xl transition duration-200 cursor-not-allowed">အရောင်းစာရင်းသွင်းမည် (Checkout)</button>
        </div>
    </div>

    <script>
        // ⚠️ ဤနေရာတွင် သင်၏ Google Apps Script URL ကို နောက်ပိုင်းတွင် အစားထိုးပေးပါရန်
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwalAmZ1Dv9wluFGAAqNMfWacM_G07Id06epNRagW-ZiZhXTpSBkEA4efUVjoRcIwmc/exec"; 
        
        let products = [];
        let cart = [];
        let currentUser = null;

        // အကောင့်ဝင်ထားခြင်း ရှိမရှိ စစ်ဆေးခြင်း
        window.onload = function() {
            currentUser = JSON.parse(localStorage.getItem('current_pos_user'));
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('userInfo').innerText = `${currentUser.username} (${currentUser.role})`;
            fetchProductsFromSheet();
            
            // ၅ မိနစ်တစ်ခါ နောက်ကွယ်မှ Auto Refresh လုပ်စေခြင်း (၅ မိနစ် = ၃၀၀,၀၀၀ မီလီစက္ကန့်)
            setInterval(fetchProductsFromSheet, 300000);
        };

        // Google Sheet ထံမှ ပစ္စည်းစာရင်းကို လှမ်းဖတ်ခြင်း (ဝယ်ဈေးလုံးဝမပါလာစေရန် နောက်ကွယ်မှ စစ်ထုတ်ထားသည်)
        function fetchProductsFromSheet() {
            if(APPS_SCRIPT_URL === "YOUR_GOOGLE_WEB_APP_URL") {
                document.getElementById('syncStatus').innerText = "ညွှန်ကြားချက်အတိုင်း Google Sheet URL မထည့်ရသေးပါ။";
                return;
            }
            
            document.getElementById('syncStatus').innerText = "ဒေတာအသစ် ပြန်ယူနေသည်...";
            document.getElementById('syncStatus').className = "text-orange-500 font-bold";

            fetch(`${APPS_SCRIPT_URL}?action=getProducts`)
                .then(res => res.json())
                .then(data => {
                    products = data;
                    renderProducts();
                    document.getElementById('syncStatus').innerText = "အွန်လိုင်းနှင့် ကိုက်ညီပြီး (အလိုအလျောက် Refresh စနစ် အလုပ်လုပ်နေသည်)";
                    document.getElementById('syncStatus').className = "text-green-600 font-bold";
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('syncStatus').innerText = "ချိတ်ဆက်မှု အဆင်မပြေပါ။";
                    document.getElementById('syncStatus').className = "text-red-500 font-bold";
                });
        }

        // ပစ္စည်းများကို Screen ပေါ်တွင် ပြသခြင်း
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = "p-4 border rounded-xl bg-slate-50 flex justify-between items-center shadow-sm hover:border-blue-400 transition";
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-800">${p.name}</h4>
                        <p class="text-xs text-slate-500">အမျိုးအစား: ${p.category} | ID: ${p.id}</p>
                        <p class="text-sm font-semibold text-blue-600 mt-1">ရောင်းဈေး: ${p.sellingPrice.toLocaleString()} ကျပ်</p>
                        <p class="text-xs font-bold ${p.stock > 5 ? 'text-green-600' : 'text-red-500'} mt-0.5">လက်ကျန်: ${p.stock} အိတ်/ထုပ်</p>
                    </div>
                    <button onclick="addToCart('${p.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">+ ထည့်ရန်</button>
                `;
                grid.appendChild(card);
            });
        }

        // ဘောက်ချာထဲသို့ ပစ္စည်းထည့်ခြင်း
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product || product.stock <= 0) {
                alert('ပစ္စည်းလက်ကျန် မရှိတော့ပါသဖြင့် ရောင်းချ၍မရပါ။');
                return;
            }

            const cartItem = cart.find(item => item.id === id);
            if (cartItem) {
                if (cartItem.qty >= product.stock) {
                    alert('ဆိုင်တွင်းရှိ လက်ကျန်အရေအတွက်ထက် ပိုရောင်း၍ မရပါ။');
                    return;
                }
                cartItem.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        // ဘောက်ချာမျက်နှာပြင် ပြသခြင်း
        function renderCart() {
            const container = document.getElementById('cartItems');
            const checkoutBtn = document.getElementById('checkoutBtn');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center py-8">ဘောက်ချာထဲတွင် ပစ္စည်းမရှိသေးပါ။</p>';
                document.getElementById('cartTotal').innerText = '0';
                checkoutBtn.disabled = true;
                checkoutBtn.className = "w-full bg-slate-400 text-white font-bold py-3 rounded-xl cursor-not-allowed";
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.sellingPrice * item.qty;
                const row = document.createElement('div');
                row.className = "flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border text-sm";
                row.innerHTML = `
                    <div class="flex-1">
                        <p class="font-bold text-slate-800">${item.name}</p>
                        <p class="text-xs text-slate-500">${item.sellingPrice.toLocaleString()} x ${item.qty}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQty(${index}, -1)" class="bg-slate-300 px-2 py-0.5 rounded font-bold">-</button>
                        <span class="font-bold w-4 text-center">${item.qty}</span>
                        <button onclick="changeQty(${index}, 1)" class="bg-slate-300 px-2 py-0.5 rounded font-bold">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('cartTotal').innerText = total.toLocaleString();
            checkoutBtn.disabled = false;
            checkoutBtn.className = "w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md";
        }

        function changeQty(index, amount) {
            const item = cart[index];
            const product = products.find(p => p.id === item.id);
            
            item.qty += amount;
            if (item.qty <= 0) {
                cart.splice(index, 1);
            } else if (item.qty > product.stock) {
                alert('ဆိုင်တွင်းရှိ လက်ကျန်အရေအတွက်ထက် ပိုရောင်း၍ မရပါ။');
                item.qty = product.stock;
            }
            renderCart();
        }

        // အရောင်းမှတ်တမ်းအား Google Sheets ထံသို့ အလိုအလျောက် ပို့ဆောင်သိမ်းဆည်းခြင်း
        function checkoutCart() {
            if (cart.length === 0) return;
            
            document.getElementById('syncStatus').innerText = "ဘောက်ချာမှတ်တမ်းကို Google Sheet ထံ ပို့နေသည်...";
            document.getElementById('syncStatus').className = "text-orange-500 font-bold";
            
            const invoiceData = {
                action: "addSale",
                cashier: currentUser.username,
                items: JSON.stringify(cart.map(i => ({ id: i.id, name: i.name, qty: i.qty, sellingPrice: i.sellingPrice })))
            };

            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(invoiceData)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === "success") {
                    alert("အရောင်းမှတ်တမ်းစာရင်းသွင်းပြီးပါပြီ။ Google Sheet ထဲသို့ ဒေတာ တန်းရောက်သွားပါပြီ။");
                    cart = [];
                    renderCart();
                    fetchProductsFromSheet(); // လက်ကျန်အသစ်ကို ချက်ချင်းပြန်ဆွဲခြင်း
                } else {
                    alert("အမှားအယွင်းဖြစ်သွားပါသည်: " + result.message);
                }
            })
            .catch(err => {
                console.error(err);
                alert("အင်တာနက်လိုင်းကြောင့် စာရင်းသွင်း၍ မရနိုင်ပါ။");
            });
        }

        function logout() {
            localStorage.removeItem('current_pos_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
