<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အကောင့်အသစ်ဖွင့်ရန် - မျိုးထူး အရောင်းစနစ်</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0f172a, #1e3a8a); height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .reg-card { background: white; width: 100%; max-width: 400px; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .icon { font-size: 45px; color: #1e3a8a; margin-bottom: 10px; }
        h2 { font-size: 22px; color: #1e3a8a; margin-bottom: 5px; font-weight: bold; }
        p { color: #64748b; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #4b5563; margin-bottom: 5px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 12px; top: 13px; color: #94a3b8; font-size: 15px; }
        .input-wrapper input, .form-group select { width: 100%; padding: 11px 12px 11px 40px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        .form-group select { padding-left: 40px; background: white; -webkit-appearance: none; }
        .reg-btn { width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .login-link { display: block; margin-top: 15px; font-size: 13px; color: #1e3a8a; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="reg-card">
        <div class="icon"><i class="fa-solid fa-user-plus"></i></div>
        <h2>အကောင့်အသစ်ဆောက်ရန်</h2>
        <p>စနစ်သုံးမည့်သူ၏ အချက်အလက်များကို ဖြည့်စွက်ပါ။</p>

        <form id="regForm">
            <div class="form-group">
                <label>👤 အသုံးပြုသူအမည် (Username)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regUser" required placeholder="ဥပမာ - myothu">
                </div>
            </div>
            <div class="form-group">
                <label>🔑 လျှို့ဝှက်နံပါတ် (Password)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPass" required placeholder="••••••••">
                </div>
            </div>
            <div class="form-group">
                <label>🎖️ ရာထူး/အဆင့် သတ်မှတ်ချက် (Role)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-shield"></i>
                    <select id="regRole" required>
                        <option value="Staff">Staff (အရောင်းဝန်ထမ်း)</option>
                        <option value="Admin">Admin (မန်နေဂျာ/ပိုင်ရှင်)</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="reg-btn">အကောင့်ဆောက်မည်</button>
            <a href="login.html" class="login-link">အကောင့်ရှိပြီးသားဖြစ်ပါက ဝင်ရန် နှိပ်ပါ</a>
        </form>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('regUser').value.trim().toLowerCase();
            const password = document.getElementById('regPass').value.trim();
            const role = document.getElementById('regRole').value;

            // လက်ရှိရှိပြီးသား အကောင့်စာရင်းကို ဆွဲထုတ်ခြင်း (မရှိရင် Array အလွတ်)
            let userList = JSON.parse(localStorage.getItem('shop_users')) || [];

            // အကောင့်အမည် တူနေသလား စစ်ဆေးခြင်း
            if (userList.some(user => user.username === username)) {
                alert("⚠️ ဤ Username စာလုံးသည် ရှိပြီးသားဖြစ်နေ၍ တခြားအမည် ပြောင်းပေးပါဗျာ။");
                return;
            }

            // အကောင့်အသစ်ထည့်ခြင်း
            userList.push({ username, password, role });
            
            // LocalStorage ထဲ ပြန်သိမ်းခြင်း
            localStorage.setItem('shop_users', JSON.stringify(userList));

            alert(`🎉 ${role} အကောင့်ကို အောင်မြင်စွာ ဖန်တီးပြီးပါပြီ အစ်ကိုကြီး!\n\nLogin Page သို့ သွားပါမည်။`);
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
